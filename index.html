<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>CLICK JM-SH</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,sans-serif;background:linear-gradient(135deg,#1a1a2e,#16213e);color:#fff;min-height:100vh;user-select:none;overflow:hidden}
.top-bar{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:15px 20px;z-index:10}
.icon-btn{width:45px;height:45px;border-radius:50%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);font-size:22px;cursor:pointer;display:flex;justify-content:center;align-items:center}
.header{text-align:center;padding:70px 20px 10px}
.balance{font-size:52px;font-weight:800;background:linear-gradient(90deg,#fbbf24,#f59e0b);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.per-sec{font-size:14px;opacity:.7;margin-top:5px;font-weight:bold;color:#fbbf24}
.tap-area{display:flex;justify-content:center;align-items:center;height:32vh}
.coin{width:190px;height:190px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fde047,#f59e0b);box-shadow:0 10px 50px rgba(245,158,11,.5);display:flex;justify-content:center;align-items:center;font-size:85px;cursor:pointer;transition:transform .08s}
.coin:active{transform:scale(.9)}
.float{position:fixed;pointer-events:none;font-weight:800;color:#fbbf24;font-size:26px;animation:up .8s ease-out forwards;z-index:100;text-shadow:0 2px 5px #000}
@keyframes up{to{transform:translateY(-90px);opacity:0}}
.nav-bar{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;background:rgba(22,33,62,0.95);backdrop-filter:blur(10px);border-top:1px solid rgba(255,255,255,0.1);padding:10px 0;z-index:20;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
.nav-btn{background:none;border:none;color:#8892b0;font-size:12px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;padding:5px 15px}
.nav-btn .nav-icon{font-size:24px}
.nav-btn.active{color:#fbbf24}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:100;display:none;justify-content:center;align-items:center;padding:20px;backdrop-filter:blur(5px)}
.modal.show{display:flex}
.modal-content{background:linear-gradient(135deg,#1e2a47,#16213e);border:1px solid rgba(255,255,255,0.15);border-radius:24px;padding:25px;width:100%;max-width:400px;max-height:85vh;overflow-y:auto;position:relative}
.modal-close{position:absolute;top:15px;right:15px;background:rgba(255,255,255,0.1);border:none;color:#fff;width:35px;height:35px;border-radius:50%;font-size:18px;cursor:pointer}
.modal-title{font-size:22px;font-weight:800;text-align:center;margin-bottom:20px}
.promo-input{width:100%;padding:15px;border-radius:12px;border:2px solid rgba(255,255,255,0.15);background:rgba(0,0,0,0.3);color:#fff;font-size:16px;margin-bottom:15px;text-align:center;text-transform:uppercase;letter-spacing:2px;font-weight:700}
.promo-input:focus{outline:none;border-color:#fbbf24}
.promo-btn{width:100%;padding:15px;border-radius:12px;border:none;background:linear-gradient(90deg,#fbbf24,#f59e0b);color:#1a1a2e;font-weight:800;font-size:16px;cursor:pointer}
.promo-btn:active{transform:scale(0.98)}
.promo-msg{text-align:center;margin-top:15px;font-weight:700;font-size:14px;min-height:20px}

/* КЕЙСЫ */
.cases-grid{display:flex;flex-direction:column;gap:12px}
.case-card{background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.1);border-radius:16px;padding:15px;display:flex;align-items:center;gap:15px;cursor:pointer;transition:0.2s}
.case-card:active{background:rgba(255,255,255,.15)}
.case-card.disabled{opacity:0.4;pointer-events:none}
.case-svg-wrapper{width:60px;height:60px;flex-shrink:0;animation:float 3s ease-in-out infinite}
.case-svg-wrapper svg{width:100%;height:100%;filter:drop-shadow(0 5px 10px rgba(0,0,0,0.5))}
@keyframes float{0%{transform:translateY(0px)}50%{transform:translateY(-6px)}100%{transform:translateY(0px)}}
.case-card:nth-child(2) .case-svg-wrapper{animation-delay:0.5s}
.case-card:nth-child(3) .case-svg-wrapper{animation-delay:1s}
.case-card:nth-child(4) .case-svg-wrapper{animation-delay:1.5s;filter:drop-shadow(0 0 15px #ff0080)}
.case-info{flex:1}
.case-info h3{font-size:16px;margin-bottom:3px}
.case-info p{font-size:12px;opacity:0.7}
.case-price{font-weight:800;color:#fbbf24;font-size:15px;white-space:nowrap}

/* КОЛЛЕКЦИЯ */
.collection-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.nft-card{background:rgba(255,255,255,.05);border-radius:14px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:8px;border:2px solid}
.nft-img-container{width:100%;aspect-ratio:1;border-radius:10px;background:#000;background-repeat:no-repeat;border:1px solid rgba(255,255,255,0.1)}
.nft-name{font-size:11px;text-align:center;font-weight:700;padding:0 4px}
.nft-rarity{font-size:9px;font-weight:800;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:rgba(0,0,0,0.3);letter-spacing:1px}

/* РЕДКОСТИ */
.r-common{border-color:#9ca3af}.r-common .nft-rarity{color:#9ca3af}
.r-rare{border-color:#3b82f6}.r-rare .nft-rarity{color:#3b82f6}
.r-epic{border-color:#a855f7}.r-epic .nft-rarity{color:#a855f7}
.r-legendary{border-color:#f59e0b}.r-legendary .nft-rarity{color:#f59e0b}
.r-mythic{border-color:#ef4444;box-shadow:0 0 20px rgba(239,68,68,0.5)}.r-mythic .nft-rarity{color:#ef4444}

/* АНИМАЦИЯ ОТКРЫТИЯ */
.open-anim{text-align:center;padding:20px 0; display: flex; flex-direction: column; align-items: center;}
.spin-img{width:150px;height:150px;border-radius:16px;background-repeat:no-repeat;background-color:#000;border:3px solid #8892b0;animation:pulse 0.1s infinite alternate;margin: 0 auto;}
@keyframes pulse{to{transform:scale(1.05)}}
.reveal-card{display:flex;flex-direction:column;align-items:center;animation:reveal 0.6s ease-out}
@keyframes reveal{0%{transform:scale(0) rotate(-180deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
.reveal-img{width:200px;height:200px;border-radius:16px;border:3px solid #fbbf24;box-shadow:0 0 40px rgba(251,191,36,0.5);background-repeat:no-repeat;background-color:#000}

.upgrades-grid{display:flex;flex-direction:column;gap:12px}
.upgrade{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:15px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.upgrade:active{background:rgba(255,255,255,.15)}
.upgrade.disabled{opacity:.4;pointer-events:none}
.upgrade-info h3{font-size:15px}
.upgrade-info p{font-size:12px;opacity:.6;margin-top:3px}
.price{font-weight:800;color:#fbbf24;font-size:15px}
.empty-msg{text-align:center;opacity:0.6;padding:40px 0;font-size:14px}
</style>
</head>
<body>

<audio id="bgMusic" loop><source src="music.mp3" type="audio/mpeg"></audio>

<div class="top-bar">
  <button class="icon-btn" id="promoBtn">🎁</button>
  <button class="icon-btn" id="musicBtn">🔇</button>
</div>

<div class="header">
  <div class="balance" id="balance">0</div>
  <div class="per-sec" id="perSec"></div>
</div>

<div class="tap-area"><div class="coin" id="coin">🪙</div></div>

<div class="nav-bar">
  <button class="nav-btn active" data-tab="upgrades"><span class="nav-icon">👆</span>Прокачка</button>
  <button class="nav-btn" data-tab="cases"><span class="nav-icon">🎁</span>Кейсы</button>
  <button class="nav-btn" data-tab="collection"><span class="nav-icon">🖼️</span>Коллекция</button>
</div>

<div class="modal" id="promoModal">
  <div class="modal-content">
    <button class="modal-close" onclick="closeModal('promoModal')">✕</button>
    <div class="modal-title">🎁 Промокод</div>
    <input class="promo-input" id="promoInput" placeholder="ВВЕДИ КОД" maxlength="15">
    <button class="promo-btn" id="promoSubmit">Активировать</button>
    <div class="promo-msg" id="promoMsg"></div>
  </div>
</div>

<div class="modal" id="upgradesModal">
  <div class="modal-content">
    <button class="modal-close" onclick="closeModal('upgradesModal')">✕</button>
    <div class="modal-title">👆 Прокачка</div>
    <div class="upgrades-grid">
      <div class="upgrade" id="upClick"><div class="upgrade-info"><h3>👆 Сила клика</h3><p id="clickLevel">Ур. 1</p></div><div class="price" id="clickPrice">50</div></div>
      <div class="upgrade" id="upAuto"><div class="upgrade-info"><h3>🤖 Автокликер</h3><p id="autoLevel">Ур. 0</p></div><div class="price" id="autoPrice">100</div></div>
    </div>
  </div>
</div>

<div class="modal" id="casesModal">
  <div class="modal-content">
    <button class="modal-close" onclick="closeModal('casesModal')">✕</button>
    <div class="modal-title">🎁 Магазин кейсов</div>
    <div class="cases-grid" id="casesGrid"></div>
  </div>
</div>

<div class="modal" id="collectionModal">
  <div class="modal-content">
    <button class="modal-close" onclick="closeModal('collectionModal')">✕</button>
    <div class="modal-title">🖼️ Коллекция NFT</div>
    <div id="collectionContent"></div>
  </div>
</div>

<div class="modal" id="openModal">
  <div class="modal-content"><div class="open-anim" id="openAnim"></div></div>
</div>

<script>
const tg = window.Telegram?.WebApp;
if (tg){ tg.ready(); tg.expand(); }

let state = {
  coins: parseInt(localStorage.getItem('jm_coins')) || 0,
  clickPower: parseInt(localStorage.getItem('jm_clickPower')) || 1,
  autoPower: parseInt(localStorage.getItem('jm_autoPower')) || 0,
  inventory: JSON.parse(localStorage.getItem('jm_inventory') || '[]'),
  usedPromos: JSON.parse(localStorage.getItem('jm_usedPromos') || '[]')
};
function save(){
  localStorage.setItem('jm_coins', state.coins); localStorage.setItem('jm_clickPower', state.clickPower);
  localStorage.setItem('jm_autoPower', state.autoPower); localStorage.setItem('jm_inventory', JSON.stringify(state.inventory));
  localStorage.setItem('jm_usedPromos', JSON.stringify(state.usedPromos));
}
const fmt = n => n>=1e6?(n/1e6).toFixed(2)+'M':n>=1e3?(n/1e3).toFixed(1)+'K':Math.floor(n).toString();

// ==========================================
// НАШИ NFT (УБЕДИСЬ, ЧТО ФАЙЛЫ НАЗВАНЫ set1, set2, set3, set4)
// ==========================================
const NFT_POOL = {
  common: [
    {name:'Кольцо', img:'set1.png', x:0, y:0, cols:9, rows:4},
    {name:'Браслет', img:'set1.png', x:1, y:0, cols:9, rows:4},
    {name:'Сердце', img:'set1.png', x:2, y:0, cols:9, rows:4},
    {name:'Подарок', img:'set2.png', x:0, y:0, cols:8, rows:10},
    {name:'Зелье', img:'set2.png', x:1, y:0, cols:8, rows:10},
    {name:'Свеча', img:'set1.png', x:4, y:0, cols:9, rows:4}
  ],
  rare: [
    {name:'Мишка', img:'set1.png', x:1, y:1, cols:9, rows:4},
    {name:'Шкатулка', img:'set1.png', x:2, y:1, cols:9, rows:4},
    {name:'Питомец', img:'set2.png', x:1, y:3, cols:8, rows:10},
    {name:'Подарок', img:'set2.png', x:3, y:4, cols:8, rows:10},
    {name:'Кристалл', img:'set1.png', x:5, y:2, cols:9, rows:4}
  ],
  epic: [
    {name:'Pepe', img:'set3.png', x:0, y:0, cols:9, rows:3},
    {name:'Кепка', img:'set3.png', x:5, y:0, cols:9, rows:3},
    {name:'Heart Locket', img:'set3.png', x:7, y:0, cols:9, rows:3},
    {name:'Золотой шар', img:'set3.png', x:6, y:1, cols:9, rows:3},
    {name:'Пепе', img:'set3.png', x:1, y:2, cols:9, rows:3}
  ],
  legendary: [
    {name:'Руки', img:'set4.png', x:0, y:0, cols:9, rows:10},
    {name:'Очки', img:'set4.png', x:0, y:2, cols:9, rows:10},
    {name:'Чипсы', img:'set4.png', x:0, y:3, cols:9, rows:10},
    {name:'Сноуборд', img:'set4.png', x:0, y:4, cols:9, rows:10},
    {name:'Собака', img:'set4.png', x:0, y:5, cols:9, rows:10}
  ],
  mythic: [
    {name:'Спорткар', img:'set4.png', x:5, y:8, cols:9, rows:10},
    {name:'Мотоцикл', img:'set4.png', x:6, y:8, cols:9, rows:10},
    {name:'Лимузин', img:'set4.png', x:7, y:8, cols:9, rows:10},
    {name:'Гоночная', img:'set4.png', x:8, y:8, cols:9, rows:10},
    {name:'Танк', img:'set4.png', x:4, y:9, cols:9, rows:10}
  ]
};

const RARITY_NAMES = {common:'Common', rare:'Rare', epic:'Epic', legendary:'Legendary', mythic:'Mythic'};
function getNftStyle(nft) {
  const posX = (nft.x / (nft.cols - 1)) * 100;
  const posY = (nft.y / (nft.rows - 1)) * 100;
  return `background-image:url('${nft.img}'); background-size:${nft.cols*100}% ${nft.rows*100}%; background-position:${posX}% ${posY}%;`;
}

// ============ КЕЙСЫ (SVG) ============
const SVG_BRONZE = `<svg viewBox="0 0 100 100"><defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#b06e3c"/><stop offset="100%" stop-color="#6b3e1f"/></linearGradient><linearGradient id="br" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ffd700"/><stop offset="100%" stop-color="#b8860b"/></linearGradient></defs><rect x="15" y="45" width="70" height="45" rx="8" fill="url(#b)" stroke="#ffd700" stroke-width="2"/><rect x="10" y="30" width="80" height="20" rx="6" fill="url(#b)" stroke="#ffd700" stroke-width="2"/><rect x="42" y="30" width="16" height="60" fill="url(#br)"/><path d="M50 30 Q30 10 20 25 Q35 30 50 30" fill="url(#br)"/><path d="M50 30 Q70 10 80 25 Q65 30 50 30" fill="url(#br)"/><rect x="40" y="55" width="20" height="15" rx="4" fill="#ffd700"/><circle cx="50" cy="62" r="3" fill="#6b3e1f"/></svg>`;
const SVG_SILVER = `<svg viewBox="0 0 100 100"><defs><linearGradient id="s" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#d3d3d3"/><stop offset="100%" stop-color="#708090"/></linearGradient><linearGradient id="sr" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#fff"/><stop offset="100%" stop-color="#b0c4de"/></linearGradient></defs><rect x="15" y="45" width="70" height="45" rx="8" fill="url(#s)" stroke="#fff" stroke-width="2"/><rect x="10" y="30" width="80" height="20" rx="6" fill="url(#s)" stroke="#fff" stroke-width="2"/><rect x="42" y="30" width="16" height="60" fill="url(#sr)"/><path d="M50 30 Q30 10 20 25 Q35 30 50 30" fill="url(#sr)"/><path d="M50 30 Q70 10 80 25 Q65 30 50 30" fill="url(#sr)"/><rect x="40" y="55" width="20" height="15" rx="4" fill="#fff"/><circle cx="50" cy="62" r="3" fill="#708090"/></svg>`;
const SVG_GOLD = `<svg viewBox="0 0 100 100"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ffd700"/><stop offset="100%" stop-color="#daa520"/></linearGradient><linearGradient id="gr" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ffefd5"/><stop offset="100%" stop-color="#ffb6c1"/></linearGradient></defs><rect x="15" y="45" width="70" height="45" rx="8" fill="url(#g)" stroke="#ffefd5" stroke-width="2"/><rect x="10" y="30" width="80" height="20" rx="6" fill="url(#g)" stroke="#ffefd5" stroke-width="2"/><rect x="42" y="30" width="16" height="60" fill="url(#gr)"/><path d="M50 30 Q30 10 20 25 Q35 30 50 30" fill="url(#gr)"/><path d="M50 30 Q70 10 80 25 Q65 30 50 30" fill="url(#gr)"/><polygon points="50,50 52,55 57,55 53,58 55,63 50,60 45,63 47,58 43,55 48,55" fill="#fff"/><rect x="40" y="55" width="20" height="15" rx="4" fill="#ffefd5"/><circle cx="50" cy="62" r="3" fill="#daa520"/></svg>`;
const SVG_MYTHIC = `<svg viewBox="0 0 100 100"><defs><linearGradient id="m" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#4a148c"/><stop offset="100%" stop-color="#1a0033"/></linearGradient><linearGradient id="mr" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ff0080"/><stop offset="100%" stop-color="#ff8c00"/></linearGradient></defs><rect x="15" y="45" width="70" height="45" rx="8" fill="url(#m)" stroke="#ff0080" stroke-width="2"/><rect x="10" y="30" width="80" height="20" rx="6" fill="url(#m)" stroke="#ff0080" stroke-width="2"/><rect x="42" y="30" width="16" height="60" fill="url(#mr)"/><path d="M50 30 Q30 10 20 25 Q35 30 50 30" fill="url(#mr)"/><path d="M50 30 Q70 10 80 25 Q65 30 50 30" fill="url(#mr)"/><circle cx="50" cy="55" r="8" fill="#ff0080" opacity="0.8"/><circle cx="50" cy="55" r="4" fill="#fff"/></svg>`;

const CASES = [
  { id:'bronze', name:'Бронзовый кейс', svg:SVG_BRONZE, price:500, chances:{common:70, rare:25, epic:4, legendary:1, mythic:0} },
  { id:'silver', name:'Серебряный кейс', svg:SVG_SILVER, price:5000, chances:{common:30, rare:45, epic:20, legendary:4, mythic:1} },
  { id:'gold', name:'Золотой кейс', svg:SVG_GOLD, price:25000, chances:{common:0, rare:35, epic:40, legendary:20, mythic:5} },
  { id:'mythic', name:'Мифический кейс', svg:SVG_MYTHIC, price:100000, chances:{common:0, rare:0, epic:40, legendary:40, mythic:20} }
];

// ============ ПРОМОКОДЫ ============
const PROMOS = {
  'START100': {coins:100, msg:'+100 монет!'}, 'JM2024': {coins:500, msg:'+500 монет!'},
  'CLICKER': {clickPower:1, msg:'Сила клика +1!'}, 'AUTOBOOST': {autoPower:1, msg:'Автокликер +1!'},
  'BOOST': {coins:1000, msg:'+1000 монет!'}, 'LUCKY': {coins:2000, msg:'+2000 монет!'},
  'GOLD': {coins:5000, msg:'+5000 монет!'}, 'DIAMOND': {coins:10000, msg:'+10000 монет!'},
  'GODPOWER': {clickPower:5, msg:'Сила клика +5!!!'}, 'SECRET': {coins:50000, msg:'+50000 монет!'}
};

// ============ РЕНДЕР ============
const balance = document.getElementById('balance'), perSec = document.getElementById('perSec');
function render(){
  balance.textContent = fmt(state.coins);
  perSec.textContent = state.autoPower > 0 ? `+${fmt(state.autoPower)} монет/сек` : 'Тапай монету!';
  const cCost = 50 * (state.clickPower ** 2), aCost = 100 * ((state.autoPower + 1) ** 2);
  document.getElementById('clickLevel').textContent = `Ур. ${state.clickPower}`;
  document.getElementById('clickPrice').textContent = `💰 ${fmt(cCost)}`;
  document.getElementById('autoLevel').textContent = `Ур. ${state.autoPower}`;
  document.getElementById('autoPrice').textContent = `💰 ${fmt(aCost)}`;
  document.getElementById('upClick').classList.toggle('disabled', state.coins < cCost);
  document.getElementById('upAuto').classList.toggle('disabled', state.coins < aCost);
  renderCases(); renderCollection();
}

function renderCases(){
  document.getElementById('casesGrid').innerHTML = CASES.map(c => `
    <div class="case-card ${state.coins < c.price ? 'disabled' : ''}" onclick="openCase('${c.id}')">
      <div class="case-svg-wrapper">${c.svg}</div>
      <div class="case-info"><h3>${c.name}</h3><p>Шанс на Mythic: ${c.chances.mythic}%</p></div>
      <div class="case-price">💰 ${fmt(c.price)}</div>
    </div>`).join('');
}

function renderCollection(){
  const box = document.getElementById('collectionContent');
  if (state.inventory.length === 0){ box.innerHTML = '<div class="empty-msg">Пока пусто. Открывай кейсы! 🎁</div>'; return; }
  const order = {mythic:0, legendary:1, epic:2, rare:3, common:4};
  const sorted = [...state.inventory].sort((a,b) => order[a.rarity] - order[b.rarity]);
  box.innerHTML = `<div class="collection-grid">${sorted.map(n => `
    <div class="nft-card r-${n.rarity}">
      <div class="nft-img-container" style="${getNftStyle(n)}"></div>
      <div class="nft-name">${n.name}</div>
      <div class="nft-rarity">${RARITY_NAMES[n.rarity]}</div>
    </div>`).join('')}</div>`;
}

// ============ КЛИКИ И ПРОКАЧКА ============
document.getElementById('coin').addEventListener('click', e => {
  state.coins += state.clickPower; render(); save();
  tg?.HapticFeedback?.impactOccurred('light'); playCoinSound();
  const f = document.createElement('div'); f.className = 'float'; f.textContent = '+' + state.clickPower;
  f.style.left = (e.clientX - 20) + 'px'; f.style.top = (e.clientY - 20) + 'px';
  document.body.appendChild(f); setTimeout(() => f.remove(), 800);
});
document.getElementById('upClick').addEventListener('click', () => {
  const cost = 50 * (state.clickPower ** 2);
  if (state.coins >= cost){ state.coins -= cost; state.clickPower++; render(); save(); tg?.HapticFeedback?.notificationOccurred('success'); }
});
document.getElementById('upAuto').addEventListener('click', () => {
  const cost = 100 * ((state.autoPower + 1) ** 2);
  if (state.coins >= cost){ state.coins -= cost; state.autoPower++; render(); save(); tg?.HapticFeedback?.notificationOccurred('success'); }
});
setInterval(() => { if (state.autoPower > 0){ state.coins += state.autoPower; render(); save(); } }, 1000);

// ============ МОДАЛКИ ============
function openModal(id){ document.getElementById(id).classList.add('show'); }
function closeModal(id){ document.getElementById(id).classList.remove('show'); }
document.getElementById('promoBtn').addEventListener('click', () => openModal('promoModal'));
document.querySelectorAll('.nav-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    if (btn.dataset.tab === 'upgrades') openModal('upgradesModal');
    if (btn.dataset.tab === 'cases') openModal('casesModal');
    if (btn.dataset.tab === 'collection') openModal('collectionModal');
  });
});
document.querySelectorAll('.modal').forEach(m => { m.addEventListener('click', e => { if (e.target === m) m.classList.remove('show'); }); });

// ============ ПРОМОКОД ============
document.getElementById('promoSubmit').addEventListener('click', () => {
  const input = document.getElementById('promoInput'), msg = document.getElementById('promoMsg');
  const code = input.value.trim().toUpperCase();
  if (!code){ msg.style.color = '#ef4444'; msg.textContent = 'Введи код!'; return; }
  if (state.usedPromos.includes(code)){ msg.style.color = '#ef4444'; msg.textContent = 'Уже использован'; return; }
  if (!PROMOS[code]){ msg.style.color = '#ef4444'; msg.textContent = 'Кода не существует ❌'; return; }
  const reward = PROMOS[code];
  if (reward.coins) state.coins += reward.coins;
  if (reward.clickPower) state.clickPower += reward.clickPower;
  if (reward.autoPower) state.autoPower += reward.autoPower;
  state.usedPromos.push(code); save(); render(); input.value = '';
  msg.style.color = '#10b981'; msg.textContent = '✅ ' + reward.msg;
  tg?.HapticFeedback?.notificationOccurred('success'); playCoinSound();
});

// ============ ОТКРЫТИЕ КЕЙСА ============
function rollRarity(chances){
  const total = Object.values(chances).reduce((a,b) => a+b, 0);
  let roll = Math.random() * total;
  for (const [rarity, chance] of Object.entries(chances)){ if (roll < chance) return rarity; roll -= chance; }
  return 'common';
}

function openCase(caseId){
  const c = CASES.find(x => x.id === caseId);
  if (state.coins < c.price) return;
  state.coins -= c.price;

  const rarity = rollRarity(c.chances);
  const pool = NFT_POOL[rarity];
  const base = pool[Math.floor(Math.random() * pool.length)];
  const nft = { name: base.name, rarity, img: base.img, x: base.x, y: base.y, cols: base.cols, rows: base.rows, id: Date.now() };
  state.inventory.push(nft); save(); render();

  const anim = document.getElementById('openAnim');
  document.querySelectorAll('.modal').forEach(m => m.classList.remove('show'));
  openModal('openModal');

  let ticks = 0;
  const interval = setInterval(() => {
    // ТУТ ТЕПЕРЬ КРУТЯТСЯ ТВОИ NFT ВМЕСТО ЭМОДЗИ
    const allRarities = ['common', 'rare', 'epic', 'legendary', 'mythic'];
    const rndRarity = allRarities[Math.floor(Math.random() * allRarities.length)];
    const rndPool = NFT_POOL[rndRarity];
    const rndNft = rndPool[Math.floor(Math.random() * rndPool.length)];
    const rndStyle = getNftStyle(rndNft);
    
    anim.innerHTML = `<div class="spin-img" style="${rndStyle}"></div>`;
    
    playTickSound(); ticks++;
    if (ticks > 15){
      clearInterval(interval);
      const style = getNftStyle(nft);
      anim.innerHTML = `
        <div class="reveal-card">
          <div class="reveal-img" style="${style}"></div>
          <div style="margin-top:20px;font-size:22px;font-weight:800;color:#fbbf24">${nft.name}</div>
          <div class="nft-rarity r-${rarity}" style="display:inline-block;margin-top:8px;font-size:14px;padding:5px 12px;border:2px solid;border-color:inherit">${RARITY_NAMES[rarity]}</div>
          <button class="promo-btn" style="margin-top:25px" onclick="closeModal('openModal')">Забрать</button>
        </div>`;
      playWinSound(rarity); tg?.HapticFeedback?.notificationOccurred('success');
    }
  }, 100);
}

// ============ МУЗЫКА И ЗВУКИ ============
const bgMusic = document.getElementById('bgMusic'), musicBtn = document.getElementById('musicBtn');
musicBtn.addEventListener('click', () => {
  if (bgMusic.paused) { bgMusic.play(); musicBtn.textContent = '🔊'; }
  else { bgMusic.pause(); musicBtn.textContent = '🔇'; }
});
let audioCtx = null;
function getCtx(){ if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); return audioCtx; }
function playCoinSound(){ const ctx = getCtx(), now = ctx.currentTime; const o = ctx.createOscillator(), g = ctx.createGain(); o.type = 'sine'; o.frequency.setValueAtTime(880, now); o.frequency.exponentialRampToValueAtTime(1320, now + 0.1); o.connect(g); g.connect(ctx.destination); g.gain.setValueAtTime(0.1, now); g.gain.exponentialRampToValueAtTime(0.001, now + 0.1); o.start(now); o.stop(now + 0.1); }
function playTickSound(){ const ctx = getCtx(), now = ctx.currentTime; const o = ctx.createOscillator(), g = ctx.createGain(); o.type = 'square'; o.frequency.value = 600; o.connect(g); g.connect(ctx.destination); g.gain.setValueAtTime(0.05, now); g.gain.exponentialRampToValueAtTime(0.001, now + 0.05); o.start(now); o.stop(now + 0.05); }
function playWinSound(rarity){
  const ctx = getCtx(), now = ctx.currentTime;
  const freqs = rarity === 'mythic' ? [523, 659, 784, 1046, 1318] : rarity === 'legendary' ? [523, 659, 784, 1046] : [523, 659, 784];
  freqs.forEach((f, i) => { const o = ctx.createOscillator(), g = ctx.createGain(); o.type = 'triangle'; o.frequency.value = f; o.connect(g); g.connect(ctx.destination); g.gain.setValueAtTime(0.1, now + i*0.12); g.gain.exponentialRampToValueAtTime(0.001, now + i*0.12 + 0.25); o.start(now + i*0.12); o.stop(now + i*0.12 + 0.3); });
}

render();
</script>
